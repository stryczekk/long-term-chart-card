<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>long-term-chart-card browser test</title>
<style>
  body { background: #131a24; margin: 0; padding: 16px; font-family: sans-serif;
         --primary-text-color: #c3cfdf; --secondary-text-color: #7c8ca3;
         --divider-color: #2a3547; --card-background-color: #1b2433; --primary-color: #ffc300; }
  ha-card { display: block; background: #1b2433; border-radius: 12px; width: 600px; }
  #stage > * { margin-bottom: 16px; }
  #results { color: #c3cfdf; white-space: pre; }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="results">RUNNING</pre>
<script type="module">
import "../../long-term-chart-card.js";

const fixture = await (await fetch("fixture.json")).json();
const shot = new URLSearchParams(location.search).has("shot");
const results = [];
const check = (name, ok, detail = "") => results.push({ name, ok: !!ok, detail: ok ? "" : String(detail) });
const tick = (ms = 50) => new Promise((r) => setTimeout(r, ms));

// Fixture timestamps are from the moment it was recorded; shift them so the
// data ends "now" and the card's own time window keeps all of it.
const shiftMs = Date.now() - Date.parse(fixture.generated);
const shifted = {};
for (const [id, points] of Object.entries(fixture.statistics)) {
  shifted[id] = points.map((p) => ({ ...p, start: p.start + shiftMs, end: p.end + shiftMs }));
}

function fakeHass(language, { ws = null, api = null } = {}) {
  const calls = [];
  return {
    calls,
    language,
    locale: { language },
    states: fixture.states,
    callWS: async (msg) => { calls.push(msg); return ws ? ws(msg) : shifted; },
    callApi: async (method, path) => { calls.push({ method, path }); return api ? api(method, path) : {}; },
  };
}

async function mount(config, hass) {
  const el = document.createElement("long-term-chart-card");
  el.setConfig(config);
  document.getElementById("stage").appendChild(el);
  el.hass = hass;
  for (let i = 0; i < 40 && !el.shadowRoot.querySelector("polyline") && !el.shadowRoot.getElementById("info").textContent; i++) await tick();
  return el;
}
const q = (el, sel) => el.shadowRoot.querySelectorAll(sel);
const T = "sensor.living_room_temperature";
const O = "sensor.outside_temperature";
const H = "sensor.living_room_humidity";

const base = { type: "custom:long-term-chart-card", title: "Temperatures", days: 7,
  entities: [T, O, { entity: H, axis: "right" }] };

if (shot) {
  await mount({ ...base, y_min_step: 1 }, fakeHass("en"));
  document.getElementById("results").remove();
} else {
  // 1. English, statistics, two axes
  const hass = fakeHass("en");
  const el = await mount(base, hass);
  check("draws one line per series", q(el, "polyline").length === 3, q(el, "polyline").length);
  check("draws the min/max band", q(el, "polygon").length === 3, q(el, "polygon").length);
  check("legend lists every series", q(el, ".item").length === 3, q(el, ".item").length);
  const texts = [...q(el, "svg text")].map((t) => t.textContent);
  check("left axis carries °C", texts.some((t) => t.includes("°C")), texts.join("|"));
  check("right axis carries %", texts.some((t) => t.includes("%")), texts.join("|"));
  const buttons = [...q(el, "#periods button")];
  check("five default period buttons", buttons.length === 5, buttons.length);
  check("'7 days' button active", buttons.find((b) => b.className === "active")?.textContent === "7 days",
        buttons.map((b) => b.className + ":" + b.textContent).join(","));
  check("hourly statistics requested for 7 days", hass.calls[0]?.period === "hour", JSON.stringify(hass.calls[0]));
  check("friendly names in the legend", el.shadowRoot.getElementById("legend").textContent.includes("Living room"));
  check("dot-decimal numbers in English", /\d\.\d/.test(el.shadowRoot.getElementById("legend").textContent),
        el.shadowRoot.getElementById("legend").textContent);

  // 2. tooltip
  const svg = el.shadowRoot.getElementById("chart");
  const r = svg.getBoundingClientRect();
  svg.dispatchEvent(new PointerEvent("pointermove", { clientX: r.left + r.width * 0.6, clientY: r.top + 50, bubbles: true }));
  await tick();
  const tip = el.shadowRoot.getElementById("tip");
  check("tooltip shows on hover", tip.classList.contains("on"));
  check("tooltip has a row per series", tip.querySelectorAll(".row").length === 3, tip.querySelectorAll(".row").length);

  // 3. legend toggle
  el.shadowRoot.querySelector('.item[data-entity="' + O + '"]').click();
  await tick();
  check("click in legend hides the series", q(el, "polyline").length === 2, q(el, "polyline").length);
  check("hidden series marked in legend", el.shadowRoot.querySelector('.item[data-entity="' + O + '"]').classList.contains("off"));
  el.shadowRoot.querySelector('.item[data-entity="' + O + '"]').click();
  await tick();
  check("second click shows it again", q(el, "polyline").length === 3, q(el, "polyline").length);
  for (const id of [T, O, H]) el.shadowRoot.querySelector('.item[data-entity="' + id + '"]').click();
  await tick();
  check("all hidden -> hint", el.shadowRoot.getElementById("info").textContent.includes("click the legend"),
        el.shadowRoot.getElementById("info").textContent);

  // 4. period switch
  const h2 = fakeHass("en");
  const el2 = await mount({ ...base, days: 7 }, h2);
  [...q(el2, "#periods button")].find((b) => b.textContent === "24 h").click();
  await tick(150);
  // the buttons are rebuilt on click - look them up again
  const active = [...q(el2, "#periods button")].find((b) => b.className === "active");
  check("24 h button becomes active", active?.textContent === "24 h", active?.textContent);
  check("switching to 24 h fetches 5-minute statistics", h2.calls.at(-1)?.period === "5minute", JSON.stringify(h2.calls.at(-1)));

  // 5. Polish
  const pl = await mount(base, fakeHass("pl"));
  check("Polish period label", [...q(pl, "#periods button")].some((b) => b.textContent === "7 dni"));
  check("comma decimals in Polish", /\d,\d/.test(pl.shadowRoot.getElementById("legend").textContent),
        pl.shadowRoot.getElementById("legend").textContent);

  // 6. 5-minute statistics for short ranges
  const hShort = fakeHass("en");
  await mount({ ...base, days: 1 }, hShort);
  check("5-minute statistics requested for 1 day", hShort.calls[0]?.period === "5minute", JSON.stringify(hShort.calls[0]));

  // 7. errors and empty data
  const e404 = await mount({ ...base, source: "influx" },
    fakeHass("en", { api: () => { throw { status_code: 404, body: { message: "Not Found" } }; } }));
  check("influx 404 -> proxy not configured", e404.shadowRoot.getElementById("info").textContent.includes("InfluxDB Proxy integration is not installed"),
        e404.shadowRoot.getElementById("info").textContent);
  const e503pl = await mount({ ...base, source: "influx" },
    fakeHass("pl", { api: () => { throw { status_code: 503, body: { message: "x" } }; } }));
  check("influx 503 -> proxy not configured (pl)", e503pl.shadowRoot.getElementById("info").textContent.includes("nie jest zainstalowana"),
        e503pl.shadowRoot.getElementById("info").textContent);
  const e502 = await mount({ ...base, source: "influx" },
    fakeHass("en", { api: () => { throw { status_code: 502, body: { message: "InfluxDB query failed: boom" } }; } }));
  check("influx 502 -> reason shown", e502.shadowRoot.getElementById("info").textContent.includes("boom"),
        e502.shadowRoot.getElementById("info").textContent);
  const influxOk = fakeHass("en", { api: () => shifted });
  const iok = await mount({ ...base, source: "influx", days: 30 }, influxOk);
  check("influx source draws from the proxy", q(iok, "polyline").length === 3, q(iok, "polyline").length);
  check("proxy called with days", influxOk.calls[0]?.path?.includes("days=30"), JSON.stringify(influxOk.calls[0]));
  const empty = await mount(base, fakeHass("en", { ws: () => ({}) }));
  check("no statistics -> explanation", empty.shadowRoot.getElementById("info").textContent.includes("state_class"),
        empty.shadowRoot.getElementById("info").textContent);

  // 8. config validation
  let threw = false;
  try { document.createElement("long-term-chart-card").setConfig({}); } catch (e) { threw = true; }
  check("missing entities -> config error", threw);

  // 9. attacker-controlled strings: friendly_name and unit come from any
  //    integration (MQTT discovery, REST sensors...), colour and name from the
  //    dashboard config. None of them may become markup.
  const PAY = '<img src=x onerror="window.__pwned=1">';
  const evil = structuredClone(fixture.states);
  evil[T].attributes.friendly_name = PAY;
  evil[O].attributes.unit_of_measurement = PAY;
  const hEvil = { ...fakeHass("en"), states: evil };
  const xss = await mount({ ...base, entities: [
    T,
    { entity: O, color: 'red" onmouseover="window.__pwned=1' },
    { entity: H, axis: "right", name: PAY, color: 'red"/><foreignObject><img src=x onerror="window.__pwned=1"></foreignObject><x a="' },
  ] }, hEvil);
  const sv = xss.shadowRoot.getElementById("chart");
  const rr = sv.getBoundingClientRect();
  sv.dispatchEvent(new PointerEvent("pointermove", { clientX: rr.left + rr.width / 2, clientY: rr.top + 40, bubbles: true }));
  await tick(150);
  const handlers = [...xss.shadowRoot.querySelectorAll("*")].filter((e) => [...e.attributes].some((a) => a.name.startsWith("on")));
  check("rendered (escaping test is not vacuous)", q(xss, "polyline").length === 3, q(xss, "polyline").length);
  check("no injected elements or event handlers", !xss.shadowRoot.querySelector("img, foreignObject") && !handlers.length,
        handlers.map((e) => e.outerHTML.slice(0, 80)).join(" | "));
  check("no script executed (name, unit, colour, friendly_name)", !window.__pwned);
  check("hostile strings shown as text", xss.shadowRoot.getElementById("legend").textContent.includes("<img"),
        xss.shadowRoot.getElementById("legend").textContent.slice(0, 120));
  check("invalid colour falls back to the palette",
        q(xss, "polyline")[1].getAttribute("stroke") === "#4fc3f7", q(xss, "polyline")[1].getAttribute("stroke"));

  // 10. lifecycle: detached and attached again -> refresh timer comes back
  const lc = await mount(base, fakeHass("en"));
  check("timer runs while attached", !!lc._timer);
  lc.remove();
  check("timer stops when detached", !lc._timer);
  lc._lastFetch = 0;                                   // pretend it was away for a while
  const before = lc._hass.calls.length;
  document.getElementById("stage").appendChild(lc);
  await tick(100);
  check("timer restarts after re-attach", !!lc._timer);
  check("re-attach after a while refetches", lc._hass.calls.length > before, lc._hass.calls.length + " vs " + before);

  // 11. setConfig again on a live card (card editor) -> refetch, no stale hover
  const re = await mount(base, fakeHass("en"));
  const n0 = re._hass.calls.length;
  re.setConfig({ ...base, entities: [T] });
  await tick(150);
  check("setConfig on a live card refetches", re._hass.calls.length > n0);
  check("setConfig on a live card redraws", q(re, "polyline").length === 1, q(re, "polyline").length);
  const rsv = re.shadowRoot.getElementById("chart"), rr2 = rsv.getBoundingClientRect();
  rsv.dispatchEvent(new PointerEvent("pointermove", { clientX: rr2.left + rr2.width / 2, clientY: rr2.top + 40, bubbles: true }));
  await tick();
  check("tooltip follows the new config", re.shadowRoot.querySelectorAll("#tip .row").length === 1,
        re.shadowRoot.querySelectorAll("#tip .row").length);

  // 12. race: 7d (slow) -> 24h -> 7d (fast); the last request must win
  let callNo = 0;
  const slowFirst = fakeHass("en", { ws: (msg) => {
    callNo += 1;
    const delay = callNo === 2 ? 400 : 20;             // call 1 = initial mount; call 2 = first 7d switch
    const pick = callNo === 2 ? { [T]: shifted[T], [O]: shifted[O], [H]: shifted[H] } : { [T]: shifted[T] };
    return new Promise((res) => setTimeout(() => res(pick), delay));
  } });
  const race = await mount({ ...base, days: 1 }, slowFirst);
  const clickPeriod = (el, label) => [...q(el, "#periods button")].find((b) => b.textContent === label).click();
  clickPeriod(race, "7 days");      // slow, stale
  await tick(10);
  clickPeriod(race, "24 h");
  await tick(10);
  clickPeriod(race, "7 days");      // fast, newest
  await tick(700);
  check("newest request wins over a slower older one", q(race, "polyline").length === 1, q(race, "polyline").length);

  // 13. empty period must not resurrect the previous legend on pointerleave
  let emptyNext = false;
  const flip = fakeHass("en", { ws: () => (emptyNext ? {} : shifted) });
  const em = await mount(base, flip);
  emptyNext = true;
  clickPeriod(em, "30 days");
  await tick(150);
  em.shadowRoot.getElementById("chart").dispatchEvent(new PointerEvent("pointerleave", { bubbles: true }));
  await tick();
  check("empty period keeps the legend empty", em.shadowRoot.getElementById("legend").innerHTML === "",
        em.shadowRoot.getElementById("legend").textContent.slice(0, 80));

  // 14. wide range on the right axis stays inside the chart
  const powerStates = { ...fixture.states, "sensor.power": { entity_id: "sensor.power", state: "1",
    attributes: { unit_of_measurement: "W", state_class: "measurement", friendly_name: "Power" } } };
  const power = shifted[T].map((p, i) => ({ ...p, mean: (i * 53) % 8000, min: (i * 53) % 8000, max: (i * 53) % 8000 }));
  const wide = await mount({ ...base, entities: [T, { entity: "sensor.power", axis: "right" }] },
    { ...fakeHass("en", { ws: () => ({ [T]: shifted[T], "sensor.power": power }) }), states: powerStates });
  const ys = [...q(wide, "polyline")].flatMap((pl) => pl.getAttribute("points").trim().split(/\s+/).map((pt) => Number(pt.split(",")[1])));
  check("wide right-axis range is not clipped", ys.length > 0 && ys.every((y) => y >= 0 && y <= 220),
        "min y " + Math.min(...ys) + ", max y " + Math.max(...ys));

  // 15. grid step 2.5 printed with its decimal
  const quarter = shifted[T].map((p, i) => ({ ...p, mean: (i % 14), min: (i % 14), max: (i % 14) }));
  const dec = await mount({ ...base, show_range: false, entities: [T] }, fakeHass("en", { ws: () => ({ [T]: quarter }) }));
  const labels = [...q(dec, "svg text")].map((t) => t.textContent);
  check("step 2.5 labelled 2.5, 7.5 ...", labels.some((t) => t.startsWith("2.5")) && labels.some((t) => t.startsWith("7.5")), labels.join("|"));

  // 16. a single sample is visible
  const one = await mount({ ...base, entities: [T] }, fakeHass("en", { ws: () => ({ [T]: [shifted[T].at(-1)] }) }));
  const pts = q(one, "polyline")[0]?.getAttribute("points").trim().split(/\s+/) || [];
  check("single sample drawn as a visible dash", pts.length === 2 && pts[0].split(",")[0] !== pts[1].split(",")[0], pts.join(" "));

  // 17. hass before setConfig does not throw
  let early = null;
  try {
    const el = document.createElement("long-term-chart-card");
    el.hass = fakeHass("en");
    el.setConfig(base);
    document.getElementById("stage").appendChild(el);
    for (let i = 0; i < 40 && !el.shadowRoot.querySelector("polyline"); i++) await tick();
    early = q(el, "polyline").length;
  } catch (e) { early = "threw: " + e.message; }
  check("hass before setConfig works", early === 3, early);

  // 18. 1.1 options: defaults unchanged
  const dflt = await mount(base, fakeHass("en"));
  const dsvg = dflt.shadowRoot.getElementById("chart");
  check("default height 220", dsvg.style.height === "220px" && dsvg.getAttribute("viewBox") === "0 0 600 220",
        dsvg.style.height + " " + dsvg.getAttribute("viewBox"));
  check("default line width 1.8", q(dflt, "polyline")[0].getAttribute("stroke-width") === "1.8",
        q(dflt, "polyline")[0].getAttribute("stroke-width"));
  check("default band opacity 0.12", q(dflt, "polygon")[0].getAttribute("opacity") === "0.12",
        q(dflt, "polygon")[0].getAttribute("opacity"));
  check("default size unchanged (4 rows)", dflt.getCardSize() === 4 && dflt.getGridOptions().rows === 4,
        dflt.getCardSize() + "/" + dflt.getGridOptions().rows);

  // 19. 1.1 options set
  const opt = await mount({ ...base, height: 320, line_width: 3, band_opacity: 0.3 }, fakeHass("en"));
  const osvg = opt.shadowRoot.getElementById("chart");
  check("height: 320 px and viewBox", osvg.style.height === "320px" && osvg.getAttribute("viewBox") === "0 0 600 320",
        osvg.style.height + " " + osvg.getAttribute("viewBox"));
  check("height: plotted inside the taller chart",
        [...q(opt, "polyline")].flatMap((pl) => pl.getAttribute("points").trim().split(/\s+/).map((pt) => Number(pt.split(",")[1])))
          .every((y) => y >= 0 && y <= 320));
  check("height: card size grows", opt.getGridOptions().rows > 4, opt.getGridOptions().rows);
  check("line_width: 3", [...q(opt, "polyline")].every((pl) => pl.getAttribute("stroke-width") === "3"));
  check("band_opacity: 0.3", [...q(opt, "polygon")].every((pg) => pg.getAttribute("opacity") === "0.3"));
  const orect = osvg.getBoundingClientRect();
  osvg.dispatchEvent(new PointerEvent("pointermove", { clientX: orect.left + orect.width * 0.5, clientY: orect.top + 60, bubbles: true }));
  await tick();
  const odot = opt.shadowRoot.querySelector(".hover-dot");
  check("height: hover dot inside the chart", odot && parseFloat(odot.style.top) >= 0 && parseFloat(odot.style.top) <= orect.height,
        odot && odot.style.top + " of " + orect.height);

  const clamp = await mount({ ...base, height: 5, line_width: "fat", band_opacity: 7 }, fakeHass("en"));
  check("invalid values clamped / defaulted", clamp.shadowRoot.getElementById("chart").style.height === "80px" &&
        q(clamp, "polyline")[0].getAttribute("stroke-width") === "1.8" && q(clamp, "polygon")[0].getAttribute("opacity") === "1",
        clamp.shadowRoot.getElementById("chart").style.height + " " + q(clamp, "polyline")[0].getAttribute("stroke-width"));

  const noBand = await mount({ ...base, band_opacity: 0 }, fakeHass("en"));
  check("band_opacity 0 draws no band", q(noBand, "polygon").length === 0 && q(noBand, "polyline").length === 3,
        q(noBand, "polygon").length);

  const bare = await mount({ ...base, title: "", show_legend: false, show_periods: false }, fakeHass("en"));
  const vis = (el, id) => getComputedStyle(el.shadowRoot.getElementById(id)).display !== "none";
  check("show_legend false hides the legend", !vis(bare, "legend"));
  check("show_periods false hides the buttons", !vis(bare, "periods"));
  check("no title and no buttons -> no empty header", !vis(bare, "head"));
  check("still draws without legend and buttons", q(bare, "polyline").length === 3, q(bare, "polyline").length);
  const brect = bare.shadowRoot.getElementById("chart").getBoundingClientRect();
  bare.shadowRoot.getElementById("chart").dispatchEvent(new PointerEvent("pointermove",
    { clientX: brect.left + brect.width / 2, clientY: brect.top + 40, bubbles: true }));
  await tick();
  check("tooltip still works without legend", bare.shadowRoot.getElementById("tip").classList.contains("on"));
  const titled = await mount({ ...base, show_periods: false }, fakeHass("en"));
  check("title stays when only buttons are hidden", vis(titled, "head") && vis(titled, "title") && !vis(titled, "periods"));

  // 20. fill under the line
  const nf = await mount(base, fakeHass("en"));
  check("no fill by default", q(nf, "polygon.area").length === 0 && !nf.shadowRoot.querySelector("linearGradient"));
  const fa = await mount({ ...base, fill: true }, fakeHass("en"));
  check("fill: true -> an area per series", q(fa, "polygon.area").length === 3, q(fa, "polygon.area").length);
  check("bands still drawn with fill", q(fa, "polygon.band").length === 3, q(fa, "polygon.band").length);
  const g = fa.shadowRoot.querySelector("linearGradient stop");
  check("gradient starts in the series colour at fill_opacity 0.35",
        g && g.getAttribute("stop-color") === "#ffc300" && g.getAttribute("stop-opacity") === "0.35",
        g && g.outerHTML);
  const svgChildren = [...fa.shadowRoot.getElementById("chart").children].map((e) => e.tagName + (e.getAttribute("class") ? "." + e.getAttribute("class") : ""));
  check("areas drawn before every line", svgChildren.lastIndexOf("polygon.area") < svgChildren.indexOf("polyline"), svgChildren.join(","));
  const ay = fa.shadowRoot.querySelector("polygon.area").getAttribute("points").trim().split(/\s+/).map((pt) => Number(pt.split(",")[1]));
  check("area reaches the bottom of the plot", ay.at(-1) === 220 - 22 && ay.at(-2) === 220 - 22, ay.slice(-2).join(","));
  const one2 = await mount({ ...base, entities: [{ entity: T, fill: true }, O, { entity: H, axis: "right", fill: false }], fill_opacity: 0.4 }, fakeHass("en"));
  check("per-entity fill", q(one2, "polygon.area").length === 1, q(one2, "polygon.area").length);
  check("per-entity override of a card-wide fill",
        q(await mount({ ...base, fill: true, entities: [T, { entity: O, fill: false }] }, fakeHass("en")), "polygon.area").length === 1);
  check("fill_opacity applied", one2.shadowRoot.querySelector("linearGradient stop").getAttribute("stop-opacity") === "0.4");
  const two = await mount({ ...base, fill: true }, fakeHass("en"));
  check("gradient ids live in each card's own shadow root",
        two.shadowRoot.getElementById("fill-0") && fa.shadowRoot.getElementById("fill-0") &&
        two.shadowRoot.getElementById("fill-0") !== fa.shadowRoot.getElementById("fill-0"));
  const xf = await mount({ ...base, fill: true, entities: [{ entity: T, color: 'red" onload="window.__pwned=1' }] }, fakeHass("en"));
  check("hostile colour cannot reach the gradient", xf.shadowRoot.querySelector("linearGradient stop").getAttribute("stop-color") === "#ffc300" && !window.__pwned);

  // 21. min / avg / max table
  const ns = await mount(base, fakeHass("en"));
  check("no stats table by default", ns.shadowRoot.getElementById("stats").hidden);
  const st = await mount({ ...base, show_stats: true }, fakeHass("en"));
  const tbl = st.shadowRoot.getElementById("stats");
  check("show_stats: table visible", !tbl.hidden && getComputedStyle(tbl).display !== "none");
  check("one row per visible series", tbl.querySelectorAll("tbody tr").length === 3, tbl.querySelectorAll("tbody tr").length);
  check("English headers", [...tbl.querySelectorAll("th")].map((t) => t.textContent).join("|") === "|min|avg|max",
        [...tbl.querySelectorAll("th")].map((t) => t.textContent).join("|"));
  const row = tbl.querySelector('tr[data-entity="' + T + '"]');
  const tp = shifted[T];
  const exp = { min: Math.min(...tp.map((p) => p.min)), max: Math.max(...tp.map((p) => p.max)),
                avg: tp.reduce((a, p) => a + p.mean, 0) / tp.length };
  const num = (cls) => parseFloat(row.querySelector("." + cls).textContent);
  check("min/avg/max match the data", Math.abs(num("min") - exp.min) < 0.051 && Math.abs(num("max") - exp.max) < 0.051 &&
        Math.abs(num("avg") - exp.avg) < 0.051, row.textContent + " vs " + JSON.stringify(exp));
  check("unit in the cells", row.querySelector(".avg").textContent.includes("°C"), row.querySelector(".avg").textContent);
  check("time of the extreme in the title", row.querySelector(".max").title.length > 5, row.querySelector(".max").title);
  st.shadowRoot.querySelector('.item[data-entity="' + O + '"]').click();
  await tick();
  check("hidden series leaves the table", tbl.querySelectorAll("tbody tr").length === 2, tbl.querySelectorAll("tbody tr").length);
  const stpl = await mount({ ...base, show_stats: true }, fakeHass("pl"));
  check("Polish headers and decimals", [...stpl.shadowRoot.querySelectorAll("#stats th")].map((t) => t.textContent).join("|") === "|min|śr.|maks." &&
        /\d,\d/.test(stpl.shadowRoot.querySelector("#stats td.avg").textContent),
        stpl.shadowRoot.getElementById("stats").textContent.slice(0, 80));
  const stEmpty = await mount({ ...base, show_stats: true }, fakeHass("en", { ws: () => ({}) }));
  check("no data -> no table", stEmpty.shadowRoot.getElementById("stats").hidden);
  const evilS = structuredClone(fixture.states);
  evilS[T].attributes.friendly_name = '<img src=x onerror="window.__pwned=1">';
  const stx = await mount({ ...base, show_stats: true }, { ...fakeHass("en"), states: evilS });
  check("hostile name in the table stays text", !stx.shadowRoot.querySelector("#stats img") && !window.__pwned &&
        stx.shadowRoot.getElementById("stats").textContent.includes("<img"));

  const failed = results.filter((r) => !r.ok);
  document.getElementById("results").textContent =
    results.map((r) => (r.ok ? "PASS  " : "FAIL  ") + r.name + (r.ok ? "" : "  -> " + r.detail)).join("\n") +
    "\n" + (failed.length ? "FAILED" : "OK") + "  " + (results.length - failed.length) + "/" + results.length + " checks passed";
}
document.title = "DONE";
</script>
